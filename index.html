<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>潜次减压停留与标记放行台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    body.busy button { opacity: .6; pointer-events: none; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 17px; margin: 14px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; margin-top: 8px; }
    button.secondary { background: #64777b; }
    button.tab { background: #dce8e9; color: #183035; margin: 0; font-weight: 700; }
    button.tab.active { background: #1d6c78; color: #fff; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 54px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .app { display: grid; grid-template-columns: 1fr 400px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .map { position: relative; height: calc(100vh - 170px); min-height: 520px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .marker.pending { border-color: #ffd463; box-shadow: 0 0 0 3px rgba(255,180,30,.55), 0 4px 12px rgba(0,0,0,.35); }
    .marker.ghost { background: #2e5f4f; border-style: dashed; }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .filters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
    .list { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .timeline { display: grid; gap: 8px; max-height: 460px; overflow: auto; }
    .archive .item { background: #f6f4ee; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .review-card { cursor: default; background: #fffaf0; border-color: #e4c778; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .pill.pending { background: #fbecc6; border-color: #dcb45a; color: #7a5810; font-weight: 700; }
    .pill.released { background: #dff1e6; border-color: #9ac7aa; color: #1d5c36; font-weight: 700; }
    .muted { color: #5c7378; font-size: 13px; margin: 4px 0; }
    .warn { color: #8a5a00; font-size: 13px; background: #fbecc6; border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px); background: #183035; color: #fff; padding: 11px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all .3s; z-index: 10; max-width: 80vw; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 480px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>潜次减压停留与标记放行台</h1>
      <div class="muted">登记潜次后在平面图打点；超免减压限值或缺安全停留的标记只进待复核，换人复核放行后才计入时间线与导出。</div>
    </div>
    <button id="exportBtn">导出已放行 JSON</button>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel">
      <div class="filters">
        <select id="diveSelect"><option value="">选择潜次</option></select>
        <select id="typeFilter">
          <option value="">全部类型</option>
          <option value="ceramic">陶片</option>
          <option value="wood">木构件</option>
          <option value="metal">金属件</option>
          <option value="unknown">未知物</option>
        </select>
        <select id="statusFilter">
          <option value="">全部状态</option>
          <option value="pending">待复核</option>
          <option value="released">已放行</option>
        </select>
      </div>
      <div id="stats" class="stats"></div>
      <div class="tabs">
        <button type="button" class="tab" data-view="list">标记列表</button>
        <button type="button" class="tab" data-view="timeline">潜次时间线</button>
        <button type="button" class="tab" data-view="review">待复核放行台</button>
        <button type="button" class="tab" data-view="dives">潜次登记</button>
      </div>

      <form id="markerForm">
        <h2>标记信息 <span id="markerStatus"></span></h2>
        <input name="id" type="hidden">
        <div class="two-col">
          <div><label>编号</label><input name="code" required></div>
          <div><label>类型</label><select name="type">
            <option value="ceramic">陶片</option>
            <option value="wood">木构件</option>
            <option value="metal">金属件</option>
            <option value="unknown">未知物</option>
          </select></div>
        </div>
        <div class="two-col">
          <div><label>深度</label><input name="depth" placeholder="例如18.4m" required></div>
          <div><label>朝向</label><input name="orientation" placeholder="例如东北偏北"></div>
        </div>
        <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
        <label>备注</label><textarea name="note"></textarea>
        <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
      </form>

      <div id="viewPanel"></div>
    </aside>
  </main>

  <!-- 业务规则（免减压限值/安全停留/复核换人/修订失效判定） -->
  <script src="js/dive-rules.js"></script>
  <!-- 业务记录（状态机/留档/幂等提交/持久化） -->
  <script src="js/dive-records.js"></script>
  <!-- 业务页面（渲染/表单/筛选统计/时间线/导出） -->
  <script src="js/app.js"></script>
</body>
</html>
